#cloud-config
# Preparación mínima de la VM (idéntica en ambas regiones). El código de la app se envía después
# con `az vm run-command` (scripts/push-bundle.sh), sin abrir SSH.
package_update: true
package_upgrade: false
packages:
  - docker.io
  - docker-compose-v2
  - postgresql-client
  - gettext-base
  - jq
  - curl
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G
write_files:
  - path: /etc/docker/daemon.json
    content: |
      {"log-driver":"json-file","log-opts":{"max-size":"20m","max-file":"3"}}
runcmd:
  - systemctl enable --now docker
  - mkdir -p /opt/aa/data/kafka
  - chown -R 1000:1000 /opt/aa/data/kafka
  - touch /opt/aa/.cloud-init-done
